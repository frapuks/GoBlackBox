# Nginx interne au conteneur `web`.
#
# Il fait exactement deux choses : servir le build React, et relayer /api vers
# le conteneur `api`. Pas de TLS, pas de certificat, pas de domaine — c'est le
# rôle de ton Nginx Proxy Manager en amont.
#
# Conséquence pratique : NPM n'a qu'UNE seule cible à connaître, ce conteneur.
# Le front et l'API sont servis par la même origine, donc le cookie de session
# fonctionne sans configuration CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le proxy est en amont : sans ça, les logs de l'API ne verraient que
    # l'IP de ce conteneur.
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite génère des noms de fichiers avec empreinte : ils ne changent jamais
    # de contenu, on peut les mettre en cache indéfiniment.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html NE DOIT JAMAIS être mis en cache.
    #
    # C'est lui qui désigne les fichiers empreintés à charger. Mis en cache, il
    # continue de réclamer les anciens — eux-mêmes gardés un an — et l'app reste
    # figée sur la version précédente après un déploiement. Sans en-tête
    # explicite, le navigateur applique sa mise en cache heuristique et le
    # conserve de longues heures ; c'est particulièrement tenace sur une app
    # iOS installée sur l'écran d'accueil.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Même raison pour le service worker : c'est le fichier par lequel arrive
    # toute mise à jour, il doit être revalidé à chaque fois.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # `.webmanifest` n'est pas dans les types MIME par défaut de Nginx. Servi en
    # text/plain, iOS et Chrome ignorent le manifeste sans le moindre message.
    # On le déclare ici et pas dans un bloc `types`, qui REMPLACE toute la table
    # par défaut et ferait tomber les PNG en application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Fallback SPA : toutes les routes React (/fines, /me/settings…) doivent
    # renvoyer index.html, sinon un rafraîchissement de page donne un 404.
    # L'aiguillage interne repasse par `location = /index.html`, donc l'en-tête
    # de non-mise-en-cache s'applique aussi à /fines, /rules, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
