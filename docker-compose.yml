# BLACKBOX — une seule stack, identique en local et sur le Raspberry Pi.
#
#   docker compose up -d --build
#
# Ports publiés sur l'hôte :
#   6012 → front  (la seule cible à déclarer dans Nginx Proxy Manager)
#   4012 → API    (accès direct, pour diagnostiquer)
#   5012 → Postgres
#
# Le Nginx du conteneur `web` sert le front ET relaie /api vers l'API : les deux
# partagent la même origine, donc le cookie de session fonctionne sans CORS.

name: blackbox

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # ⚠ La base devient joignable depuis tout le réseau local. Pour la
      # réserver à la machine hôte, remplacer par "127.0.0.1:5012:5432".
      - "5012:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Seule différence entre local et Pi, et elle vit dans .env :
      #   development → cookie non-Secure (indispensable en http://localhost)
      #                 + logs lisibles + `npm run seed` autorisé
      #   production  → cookie Secure, logs JSON, seed refusé
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      # Le runner de migrations y dépose un pg_dump avant toute migration.
      BACKUP_DIR: /backups
    volumes:
      # Bind-mount plutôt qu'un volume nommé : les sauvegardes doivent être
      # récupérables sans passer par Docker.
      - ./backups:/backups
    ports:
      - "4012:3000"
    depends_on:
      db:
        condition: service_healthy
    # Sans ce healthcheck, Nginx démarre avant que Fastify n'écoute et renvoie
    # des 502 pendant les premières secondes — très visible au redémarrage du Pi.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "6012:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    # Nom FIGÉ, pas dérivé du nom de projet.
    # Sans ça, renommer le projet (ou le dossier) fait pointer la stack vers un
    # volume neuf : la base semble vide alors que les données sont intactes
    # dans l'ancien volume. Ne jamais modifier cette ligne sans migrer d'abord.
    name: blackbox_pgdata
